<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>같은 id 를 쓰는 입력 칸이 둘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 2026-09-11 실측: 대상 앱의 사용자 관리 화면에서 **헤더의 전역 검색 칸과 목록의
       이름 검색 칸이 같은 `id` 를 쓰고 있었다.**

       `twin-search.html` 과 갈라 둔다. 그쪽은 「접근 가능한 이름이 같아 **고를 수 없다**」
       이고, 이쪽은 「이름은 다르므로 고를 수 있는데 **고른 것이 실행되지 않는다**」다.
       둘은 다른 고장이며 고치는 자리도 다르다.

         twin-search   관찰 결과에 구별 정보를 싣는다     (tools.py · recorder.js observe)
         duplicate-id  경로가 유일해질 때까지 늘린다       (recorder.js cssPath)

       수정 전에는 `cssPath` 가 id 를 만나면 「id 는 문서에서 유일해야 한다」는 가정으로
       멈췄고, 그래서 두 칸이 `input#text-input-example-11` 이라는 **같은 경로**를 받았다.
       도구가 그 경로로 요소를 다시 찾을 때 `querySelector` 는 문서 순서상 첫 번째를 준다 —
       AI 가 목록 칸을 정확히 지목해도 입력은 헤더 칸으로 갔고, 목록은 그대로였다. -->
  <header aria-label="전역">
    <h1>Graphio</h1>
    <input id="text-input-example-11" type="text" placeholder="새로운 질문을 입력하세요.">
    <button id="global-go">검색</button>
    <p id="global-result">전역 검색 없음</p>
  </header>

  <main>
    <section aria-label="사용자 목록" class="card">
      <h2>사용자 목록</h2>
      <!-- **같은 id 다.** 문서가 규격을 어겼고, 제품은 그 문서에서도 맞는 요소를 잡아야 한다. -->
      <input id="text-input-example-11" type="text" placeholder="이름 또는 아이디 이메일을 검색하세요.">
      <button id="list-go">검색</button>
      <p id="list-result">목록 검색 없음</p>
    </section>
  </main>

  <script>
    // 어느 칸에 썼는지가 화면에 남아야 한다 — 틀린 칸에 입력한 것을 눈으로 볼 수 있어야
    // 하고, 검증도 그 문장을 읽는다.
    const boxes = document.querySelectorAll("input#text-input-example-11");
    const wire = (box, button, result, label) => {
      document.getElementById(button).addEventListener("click", () => {
        const value = box.value.trim();
        document.getElementById(result).textContent =
          value === "" ? `${label} 검색어 없음` : `${label} 검색 결과: ${value}`;
      });
    };
    wire(boxes[0], "global-go", "global-result", "전역");
    wire(boxes[1], "list-go", "list-result", "목록");
  </script>
</body>
</html>
