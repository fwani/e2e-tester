<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>지연 로딩 · 데이터 플랫폼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">데이터 플랫폼</span>
    <a href="projects.html" role="menuitem">프로젝트</a>
    <a href="data.html" role="menuitem">데이터</a>
    <a href="lazy.html" aria-current="page" role="menuitem">지연 로딩</a>
  </nav>
  <main>
    <div class="card">
      <h1>주문 목록</h1>
      <!--
        004 US2 검증용 화면.

        로딩 중에는 **같은 텍스트를 가진 스켈레톤 행 2개**를 그린다. 이것이 핵심이다 —
        후보가 2개를 매칭하는 상태를 만들어야 `.first` 폴백이 스켈레톤을 잡는 결함이
        재현된다 (research R2 실측).

        지연 후에는 `data-testid` 와 role+name 을 모두 가진 버튼 하나만 남는다.

        지연 시간은 `?ms=` 로 조절한다. 기본 2000ms 는 research R1 의 재현 조건이며,
        기본 대기 예산(10000ms)보다 작고 옛 예산(5000ms)보다도 작다 — 결함이 예산
        부족이 아니라 알고리즘 때문임을 이 값이 증명한다. 함부로 줄이지 말 것.
      -->
      <div id="rows" data-testid="order-rows">
        <div class="skeleton">불러오는 중</div>
        <div class="skeleton">불러오는 중</div>
      </div>
      <p id="status" data-testid="lazy-status">로딩 중</p>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var delay = parseInt(params.get('ms') || '2000', 10);
      if (isNaN(delay) || delay < 0) { delay = 2000; }
      if (delay > 30000) { delay = 30000; }   // 오타 하나로 검증이 멈추지 않게 한다

      setTimeout(function () {
        document.getElementById('rows').innerHTML =
          '<button type="button" data-testid="order-detail" id="order-detail">주문 상세</button>';
        document.getElementById('status').textContent = '완료';
      }, delay);
    })();
  </script>
</body>
</html>
