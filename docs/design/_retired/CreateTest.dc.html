<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #EFEBE0; color: #14130F; font-family: "IBM Plex Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7C4DDB; text-decoration: none; }
    a:hover { color: #5A31B8; }
  </style>
</helmet>
<div style="width: 1000px; min-height: 700px; background: #EFEBE0; padding: 40px; display: flex;">
  <div style="flex: 1; border: 3px solid #14130F; background: #FFFDF6; box-shadow: 10px 10px 0 #14130F; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 14px; padding: 22px 28px; border-bottom: 3px solid #14130F;">
      <div style="font-family: 'Black Han Sans', 'Arial Black', Impact, sans-serif; font-size: 28px; line-height: 1;">테스트 만들기</div>
      <div style="flex: 1;"></div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 3px solid #14130F; background: #EFEBE0;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#14130F" stroke-width="2.6"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
      </div>
    </div>

    <div style="padding: 26px 28px 28px; display: flex; flex-direction: column; gap: 22px;">

      <div style="font: 500 15px/1.5 'IBM Plex Sans KR', system-ui, sans-serif; color: #4A473F; max-width: 620px; text-wrap: pretty;">
        만드는 방법을 고르세요. 어느 쪽으로 만들어도 같은 Step 모델로 저장되고, 실행은 Playwright가 합니다.
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;">

        <div style="border: 3px solid #14130F; background: #FFFDF6; box-shadow: 6px 6px 0 #14130F; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 232px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 46px; height: 46px; border: 3px solid #14130F; background: #D9502F; color: #FFFDF6; display: flex; align-items: center; justify-content: center;">
              <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="6.5" fill="currentColor"></circle></svg>
            </div>
            <div style="font-family: 'Black Han Sans', 'Arial Black', Impact, sans-serif; font-size: 22px; line-height: 1;">직접 녹화</div>
          </div>
          <div style="font: 500 15px/1.55 'IBM Plex Sans KR', system-ui, sans-serif; text-wrap: pretty;">
            브라우저를 직접 조작해서 테스트를 만듭니다.
          </div>
          <div style="display: flex; flex-direction: column; gap: 7px; font: 400 13px/1.4 'IBM Plex Mono', ui-monospace, monospace; color: #6B675C;">
            <div>클릭 · 입력 · 선택 · 화면 이동을 그대로 기록</div>
            <div>기록 중 언제든 멈추고 고칠 수 있음</div>
          </div>
          <div style="flex: 1;"></div>
          <div style="display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; background: #14130F; color: #F5F2E9; border: 3px solid #14130F; font: 600 15px/1 'IBM Plex Sans KR', system-ui, sans-serif;">
            녹화 시작
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8h9M8.5 4.5L12.5 8l-4 3.5"></path></svg>
          </div>
        </div>

        <div style="border: 3px solid #14130F; background: #F0EBFC; box-shadow: 6px 6px 0 #14130F; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 232px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 46px; height: 46px; border: 3px solid #14130F; background: #7C4DDB; color: #FFFDF6; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg>
            </div>
            <div style="font-family: 'Black Han Sans', 'Arial Black', Impact, sans-serif; font-size: 22px; line-height: 1;">AI로 만들기</div>
          </div>
          <div style="font: 500 15px/1.55 'IBM Plex Sans KR', system-ui, sans-serif; text-wrap: pretty;">
            할 일을 말로 적으면 AI가 브라우저에서 해봅니다.
          </div>
          <div style="display: flex; flex-direction: column; gap: 7px; font: 400 13px/1.4 'IBM Plex Mono', ui-monospace, monospace; color: #55507A;">
            <div>성공한 동작만 Step으로 기록</div>
            <div>다시 돌릴 때는 AI를 쓰지 않음</div>
          </div>
          <div style="flex: 1;"></div>
          <div style="display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; background: #7C4DDB; color: #FFFDF6; border: 3px solid #14130F; font: 600 15px/1 'IBM Plex Sans KR', system-ui, sans-serif;">
            지시문 쓰기
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8h9M8.5 4.5L12.5 8l-4 3.5"></path></svg>
          </div>
        </div>

      </div>

      <div style="display: flex; align-items: flex-end; gap: 16px; border-top: 3px solid #14130F; padding-top: 22px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
          <div style="font: 600 12px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.12em; color: #6B675C;">시작 URL</div>
          <div style="display: flex; align-items: center; height: 48px; padding: 0 14px; border: 3px solid #14130F; background: #FFFDF6; font: 400 15px/1 'IBM Plex Mono', ui-monospace, monospace; color: #9A968A;">
            https://[대상 앱 URL]/login
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font: 600 12px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.12em; color: #6B675C;">브라우저</div>
          <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 3px solid #14130F; background: #FFFDF6; font: 600 15px/1 'IBM Plex Sans KR', system-ui, sans-serif;">
            Chromium
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#14130F" stroke-width="2.4"><path d="M3.5 5L7 9l3.5-4"></path></svg>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
