<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>로딩 덮개 화면</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { position: relative; min-height: 260px; }
    .overlay { position: absolute; inset: 0; background: rgba(255,255,255,.6); z-index: 10; }
    .overlay[hidden] { display: none; }
    .loader-group { display: flex; align-items: center; justify-content: center; height: 100%; }
    .loader-spinner { width: 40px; height: 40px; border: 4px solid #888; border-radius: 50%; }
    .menu { display: none; }
    .trigger:hover + .menu { display: block; }
  </style>
</head>
<body>
  <!-- **hover 오탐 재현 화면** (TC-007 step-16).
       `overlay` 는 이름·텍스트·testId 가 전혀 없는 전면 덮개다. 리코더의 hover 판정
       (FR-023c)은 "포인터가 올라간 뒤 300ms 안에 화면이 바뀌었는가" 로 추론하므로,
       **로딩이 끝나는 시점이 우연히 그 창에 겹치면** 그 변화를 hover 의 효과로 오인한다.
       그렇게 만들어진 Step 은

       - 표시가 "div 에 마우스 올리기" — 사람이 읽어도 무엇을 하려던 것인지 알 수 없고
       - 후보가 위치 경로 하나뿐이라 재실행에서 그 자리에 있는 다른 것을 잡는다.

       재현에 필요한 조건이 셋이다.

       1. **덮개에 이름이 없다.** 있으면 그 이름으로 지목되므로 문제가 되지 않는다.
       2. **hover 게이트를 통과한다.** 게이트는 `closest(INTERACTIVE)` 이고 INTERACTIVE 의
          `[tabindex]` 는 `tabindex="-1"` 도 받는다. SPA 라우터가 화면 컨테이너에 흔히
          붙이는 값이며, 그것이 덮개를 "상호작용 가능한 것 안" 으로 만든다.
       3. **변화가 hover 창 안에 든다.** 로딩 완료 시점을 벽시계로 맞추면 검증이 부하에
          따라 흔들리므로, 포인터가 덮개에 올라온 뒤 확정적으로 늦게 바뀌게 한다 —
          재현하려는 것은 "겹쳤다" 는 사실이고, 무엇이 겹치게 했는지가 아니다.

       `trigger` 는 **정상** hover 메뉴다. 오탐을 막으면서 정상 hover 까지 잃지 않는지
       같은 화면에서 판정하기 위해 둔다. -->
  <main id="app-main">
    <div class="shell" tabindex="-1">
      <div class="overlay"><div class="loader-group"></div></div>
      <div class="content">
        <button class="trigger">메뉴</button>
        <div class="menu">숨어 있던 메뉴 항목</div>
      </div>
    </div>
  </main>
  <script>
    const overlay = document.querySelector(".overlay");

    // 로딩이 끝나는 순간. 덮개를 걷고 목록을 그리므로 화면 텍스트가 늘어난다.
    //
    // **덮개를 걷어야 한다.** 실제 앱도 그렇고, 걷지 않으면 이 화면의 정상 hover 대상까지
    // 덮개에 가려 "오탐을 막으면서 정상 hover 는 남는가" 를 같은 화면에서 잴 수 없다.
    // 재실행에서 덮개 위의 로딩 표시가 포인터를 가로막는 쪽은 실패 문장 검증이 맡는다
    // (`tests/unit/test_failure_wording.py`).
    const finishLoading = () => {
      overlay.hidden = true;
      const p = document.createElement("p");
      p.textContent = "목록을 모두 불러왔습니다";
      document.querySelector(".content").append(p);
    };

    const delay = Number(new URLSearchParams(location.search).get("ms") || 120);
    overlay.addEventListener(
      "pointerover",
      () => setTimeout(finishLoading, delay),
      { once: true },
    );
  </script>
</body>
</html>
