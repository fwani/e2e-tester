name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 헌법 원칙 II (NON-NEGOTIABLE) 강제.
  # 이 잡이 실패하면 나머지 잡을 실행하지 않는다. 실행 경로에서 언어모델 호출이
  # 도달 가능해진 상태에서 다른 검사 결과는 의미가 없다.
  # ─────────────────────────────────────────────────────────────────────────
  constitution-boundaries:
    name: 아키텍처 경계 (헌법 원칙 II·I·IV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 의존성 설치
        working-directory: backend
        run: uv sync
      - name: lint-imports — execution 이 llm 에 도달하지 못함을 확인
        working-directory: backend
        run: uv run lint-imports

  # ─────────────────────────────────────────────────────────────────────────
  # 백엔드 검증을 두 잡으로 나눈다. 이전에는 한 잡이 두 pytest 단계를 **순서대로**
  # 돌아 실시간이 두 계층의 합이었다. 나누면 최댓값이 된다.
  #
  # 나누는 선은 `browser` 마커다 (`backend/tests/conftest.py`). 빠른 계층은 Chromium
  # 도, npm 도, 픽스처 앱도 필요하지 않다 — 그 설치 단계(1~2분)가 그대로 빠진다.
  # ─────────────────────────────────────────────────────────────────────────
  backend-fast:
    name: 백엔드 — 린트·브라우저 없는 테스트
    needs: constitution-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 의존성 설치
        working-directory: backend
        run: uv sync
      - name: 린트
        working-directory: backend
        run: uv run ruff check .
      - name: 브라우저 없는 테스트 (병렬)
        working-directory: backend
        run: uv run pytest -m "not browser and not timing" -q
      # 경과 시간을 단언하는 검증은 프로세스 하나로 돈다 — 나눠 쓰면 재는 값이 제품의
      # 성질이 아니라 그 순간의 부하가 된다 (`backend/tests/tiers.py`).
      - name: 시간을 재는 테스트 (순차)
        working-directory: backend
        run: uv run pytest -m "timing and not browser" -q -n 0

  backend-browser:
    name: 백엔드 — 실브라우저 테스트
    needs: constitution-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: backend
        run: uv sync
      # 제품 화면 면(`tests/abnormal/test_ui_surface.py`)이 vite dev server 를 띄운다.
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: Chromium 설치
        working-directory: backend
        run: uv run playwright install --with-deps chromium
      - name: 실브라우저 테스트 (병렬)
        working-directory: backend
        # 러너 코어(2~4개)보다 많이 나누면 브라우저가 서로 CPU 를 빼앗아 대기 시간이
        # 늘고 시간 초과가 난다. 브라우저 계층은 분배 수를 명시적으로 낮춘다.
        run: uv run pytest -m "browser and not timing" -q -n 2
      - name: 시간을 재는 실브라우저 테스트 (순차)
        working-directory: backend
        run: uv run pytest -m "browser and timing" -q -n 0

  schema-drift:
    name: DSL 스키마 드리프트 (헌법 Cross-language schema duty)
    needs: constitution-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성 설치
        working-directory: backend
        run: uv sync
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 스키마·타입 재생성 후 커밋된 산출물과 비교
        run: |
          cd backend && uv run python -m itb.schema.export && cd ..
          cd frontend && npm run gen:types && cd ..
          git diff --exit-code -- \
            backend/schema/ \
            frontend/src/types/generated/ \
            || { echo "::error::스키마 생성물이 커밋된 내용과 다릅니다. 재생성 후 커밋하세요."; exit 1; }

  frontend:
    name: 프론트엔드 검사·테스트
    needs: constitution-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 타입 검사·테스트
        working-directory: frontend
        run: |
          npm run typecheck
          npm test -- --run
