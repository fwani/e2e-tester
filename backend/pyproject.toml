[project]
name = "itb"
version = "0.1.0"
description = "Interactive AI Test Builder — 브라우저 기반 E2E 테스트 자동화 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.49",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pynacl>=1.5",
    "anthropic>=0.40",
    # 스프레드시트 읽기·쓰기 겸용. 순수 Python 이라 빌드 도구가 필요 없다 (014 research R1).
    "openpyxl>=3.1",
    # FastAPI 가 multipart 본문(UploadFile)을 읽는 데 필요하다. 예전에는 claude-code
    # extra 가 우연히 끌고 와서 동작했고, extra 없이 설치하면 업로드 경로가 통째로
    # 500 을 냈다. 선택 의존성이 채워 주던 필수 의존성이므로 여기 명시한다.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 개발용 드라이버 전용 (`ITB_AI_DRIVER=claude-code`). 이미 로그인된 Claude Code 로
# AI 작성 경로를 눈으로 확인할 때만 쓴다 — 기본 경로는 이것 없이 동작한다.
# 설치: uv sync --extra claude-code
claude-code = ["claude-agent-sdk>=0.2.152"]

[project.scripts]
itb = "itb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # 코어 수만큼 프로세스를 나눠 돈다. 개발 루프의 실시간을 줄이는 데 가장 큰 지분이다.
    # `--dist loadfile` 로 쓴다 — 한 파일의 검증은 한 프로세스에 모인다 (아래 addopts 주석).
    "pytest-xdist>=3.6",
    "import-linter>=2.1",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ─── 병렬 실행 ──────────────────────────────────────────────────────────────
#
# `-n auto` — 코어 수만큼 프로세스를 나눈다.
#
# `--dist loadfile` — **한 파일의 검증은 한 프로세스에 모인다.** 기본 `load` 를 쓰면
# 안 된다: `tests/abnormal/test_ui_surface.py` 는 시나리오를 목록 순서대로 돌아야
# 하고(AS-007 은 프로젝트가 열리기 전에만 닿을 수 있다) 세션 범위 `product_ui` 를
# 18건이 나눠 쓴다. 검증을 프로세스에 흩으면 그 순서가 깨지고, 깨진 원인이 분배라는
# 것은 실패 메시지에 드러나지 않는다.
#
# 되돌리는 법: `-p no:xdist` 또는 `-n 0`. 실패를 하나씩 따라갈 때는 그쪽이 낫다 —
# 분배된 출력은 어느 프로세스의 것인지 읽기 어렵다.
addopts = "-n auto --dist loadfile"
# "." 은 `tests` 를 패키지로 임포트하기 위한 것이고(`tests.abnormal.catalogue`),
# "tests" 는 공용 지원 모듈을 이름만으로 임포트하기 위한 것이다(`us2_support`).
pythonpath = ["src", ".", "tests"]
# 도메인의 `Test` 클래스(테스트 시나리오 모델)를 pytest 가 수집하지 않게 한다.
# 함수 기반 테스트만 쓰므로 클래스 수집 패턴을 좁힌다.
python_classes = ["*Tests"]
markers = [
    "production_kdf: 제품 기본 argon2id 비용(MODERATE)을 그대로 지난다. 느리다 — 필요한 것만 붙인다.",
    "browser: 실제 Chromium 을 띄운다. 개발 루프 기본 계층에서 빠진다.",
    "timing: 경과 시간을 단언한다. **순차로만** 돈다 (`-n 0`) — 자동으로 붙는다.",
]
filterwarnings = [
    # 우리 코드의 deprecation 은 오류로 다룬다.
    "error::DeprecationWarning",
    # starlette 의 TestClient 가 deprecated 된 anyio 별칭을 쓴다. 우리가 고칠 수 없다.
    "default:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # pytest 의 assert 사용 허용

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # 테스트 픽스처의 더미 값
# S105 는 이름에 PASS/PASSPHRASE/SECRET 이 들어간 문자열 대입을 비밀번호로 본다.
# 아래 파일들은 StrEnum 멤버 정의뿐이며(테스트 결과, 오류 코드, 명령 이름) 비밀값이 아니다.
# 실제 비밀값을 다루는 itb/secrets/ 는 이 목록에 넣지 않는다.
# 003 에서 오류 코드가 domain/error.py 로 옮겨졌다 (EC-006 단일 출처).
"src/itb/domain/error.py" = ["S105"]
"src/itb/execution/state_machine.py" = ["S105"]
"src/itb/domain/run_result.py" = ["S105"]
