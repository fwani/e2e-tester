<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>잠긴 조작과 늦게 뜨는 오류 · 데이터 플랫폼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 021 — 부정 검증과 상태 검증의 대상 화면.

       기존 고정 대상에는 「보이지만 누를 수 없는 것」도 「늦게 나타나는 것」도 없어서,
       이 기능이 실제로 동작하는지 확인할 수 없다.

       **이 화면은 일부러 그렇게 굴도록 만들어졌다.** 고쳐야 할 결함이 아니다.

       심어 둔 것 넷:

       1. `disabled` 인 삭제 버튼 — 화면에 보이고 DOM 에도 있지만 누를 수 없다.
          → `disabled` 검증이 통과하는지. `visible` 은 그냥 통과하고 `hidden` 은
            그냥 실패하는, 기존 두 어휘로 표현할 수 없던 바로 그 상태다 (US2)

       2. 같은 모양의 **활성** 삭제 버튼 — 1번과 나란히 둔다.
          → 같은 검증이 여기서는 실패해야 한다. 통과·실패가 대상에 따라 갈리는지를
            보지 않으면 「항상 통과하는 검증」과 구별되지 않는다

       3. 누르면 **0.8초 뒤에** 오류 문구가 뜨는 버튼.
          → 이 화면의 핵심이다. 「`오류` 를 포함하지 않는다」를 클릭 직후에 평가하면
            화면이 아직 비어 있어 **조용히 통과한다.** 부정 검증이 기다리지 않으면
            쓸모없는 초록색을 만든다는 것을 이 버튼 하나가 드러낸다 (US1)

       4. 조작 가능 여부를 가질 수 없는 설명용 요소.
          → 상태 검증을 걸었을 때 작성 시점 경고가 나오는지. 브라우저는 이런 요소에
            대해 「조작할 수 있다」를 참으로 주므로, 「조작할 수 있다」 검증은 항상
            통과한다 — 아무것도 검증하지 않은 초록색이다 -->
  <nav>
    <span class="brand">데이터 플랫폼</span>
    <a href="projects.html" role="menuitem">프로젝트</a>
    <a href="locked-controls.html" aria-current="page" role="menuitem">잠긴 조작</a>
  </nav>

  <main>
    <section aria-label="연관 리소스" class="card">
      <h1>연관 리소스</h1>

      <!-- 1번 — 자동으로 포함된 리소스. 사용자가 직접 뺄 수 없다. -->
      <div class="row">
        <span data-testid="auto-resource-name">주문 오브젝트 타입 (자동 포함)</span>
        <button type="button" data-testid="delete-auto" id="delete-auto" disabled>삭제</button>
      </div>

      <!-- 2번 — 사용자가 직접 넣은 리소스. 뺄 수 있다. -->
      <div class="row">
        <span data-testid="manual-resource-name">배송 오브젝트 타입 (직접 추가)</span>
        <button type="button" data-testid="delete-manual" id="delete-manual">삭제</button>
      </div>

      <!-- 4번 — 조작 가능 여부를 가질 수 없는 요소. -->
      <div data-testid="resource-note" id="resource-note">
        자동으로 포함된 리소스는 직접 제거할 수 없습니다.
      </div>
    </section>

    <section aria-label="저장" class="card">
      <h2>변경 저장</h2>

      <!-- 3번 — 늦게 뜨는 오류. -->
      <button type="button" data-testid="save-changes" id="save-changes">저장</button>
      <p data-testid="save-notice" id="save-notice" role="status"></p>
    </section>
  </main>

  <script>
    const notice = document.getElementById("save-notice");

    /*
      **0.8초는 고른 값이다.**

      즉시 뜨면 부정 검증이 기다리지 않아도 잡아내므로 이 화면이 아무것도 증명하지
      못한다. 너무 늦으면 검증의 제한 시간을 넘겨 「기다렸는데도 못 잡았다」가 되고,
      그것은 제품의 결함이 아니라 화면의 성질이다.

      0.8초는 사람이 화면을 보고 있으면 「방금 떴다」로 느끼는 정도이고, 검증의 기본
      제한 시간(10초)과 확인용으로 짧게 주는 값(5초) 양쪽 안에 넉넉히 들어간다.
    */
    document.getElementById("save-changes").addEventListener("click", () => {
      notice.textContent = "";
      setTimeout(() => {
        notice.textContent = "오류가 발생했습니다. 잠시 후 다시 시도하세요.";
      }, 800);
    });

    // 활성 삭제 버튼은 실제로 항목을 지운다 — 누를 수 있다는 것이 사실이어야 한다.
    document.getElementById("delete-manual").addEventListener("click", (e) => {
      e.target.closest(".row").remove();
    });
  </script>
</body>
</html>
