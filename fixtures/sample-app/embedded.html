<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>내장 화면 (iframe)</title>
  <link rel="stylesheet" href="style.css">
  <style>iframe { width: 100%; height: 320px; border: 1px solid #ccc; }</style>
</head>
<body>
  <!-- 주입 스크립트는 모든 프레임에서 돈다. 그래서 iframe 안의 클릭도 기록되지만,
       후보는 **그 프레임의 문서 기준**으로 측정된다. 실행이 main frame 만 뒤지면 그
       후보는 0개를 매칭하고 예산을 다 쓴 "요소를 찾을 수 없습니다" 로 끝난다.

       **바깥에도 같은 id·같은 구조를 두지 않는다.** 두면 main frame 검색이 우연히
       성공해서 결함이 드러나지 않는다. 바깥은 iframe 하나만 담는다. -->
  <h1>내장된 앱</h1>
  <iframe src="embedded-inner.html" title="내장 앱"></iframe>
</body>
</html>
