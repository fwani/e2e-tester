<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메뉴 관리 · 데이터 플랫폼</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /*
      이 화면의 요점은 **사람에게는 버튼인데 DOM 에는 버튼이 아닌 것**이다 (025 US3).
      브라우저가 커서를 손가락으로 바꾸는 것이 사람에게 「누를 수 있다」를 알리는 표시이고,
      그것이 뷰와 DOM 을 잇는 신호다.
    */
    .tree-node { padding: 8px 12px; cursor: pointer; border-radius: 6px; }
    .tree-node:hover { background: #eef2f7; }
    .tree-node.child { padding-left: 32px; }
    .row { cursor: pointer; }
    .row:hover { background: #f6f8fb; }
    .card-tile { padding: 16px; border: 1px solid #dde3ec; border-radius: 8px; cursor: pointer; }
    .icon-more { cursor: pointer; display: inline-block; padding: 4px 8px; }
    /* 커서를 바꾸지 않는 설명 문구 — 잡히면 안 된다 */
    .note { color: #5a6472; font-size: 13px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">데이터 플랫폼</span>
    <a href="projects.html" role="menuitem">프로젝트</a>
  </nav>
  <main>
    <div class="card">
      <h1>운영 관리</h1>
      <p class="note">아래 항목은 전부 마우스로 누를 수 있습니다. 어느 것도 button 태그가 아닙니다.</p>

      <!-- 트리 — div 에 이벤트 위임으로 붙는다 (React·Vue 가 하는 방식) -->
      <section aria-label="메뉴 트리" id="tree">
        <div class="tree-node" data-menu="ops">운영 관리</div>
        <div class="tree-node child" data-menu="menu-admin"><span>메뉴관리</span></div>
        <div class="tree-node child" data-menu="user-admin"><span>사용자관리</span></div>
      </section>

      <!-- 표의 행 — td 를 눌러 상세를 연다 -->
      <table>
        <thead><tr><th>이름</th><th>사용 여부</th></tr></thead>
        <tbody id="rows">
          <tr class="row" data-row="first"><td>첫 번째 메뉴</td><td>사용</td></tr>
          <tr class="row" data-row="second"><td>두 번째 메뉴</td><td>미사용</td></tr>
        </tbody>
      </table>

      <!-- 카드 전체가 눌린다. 안에 글자를 담은 자손이 있다 (커서 상속 함정) -->
      <div class="card-tile" data-tile="summary">
        <strong>요약 보기</strong>
        <div>지금 등록된 메뉴는 2개입니다.</div>
      </div>

      <!-- 아이콘만 있는 더보기 — 이름이 없다 -->
      <span class="icon-more" data-more="menu-admin">⋯</span>

      <p class="note" id="status">선택한 것이 없습니다.</p>
    </div>
  </main>

  <script>
    /*
      **`onclick` 속성을 쓰지 않는다.** React·Vue 가 이벤트 위임으로 붙이기 때문에 실제
      앱에서는 DOM 에 그 속성이 남지 않고, 그래서 관찰이 이 요소들을 놓쳐 왔다.
      이 화면이 그 상황을 그대로 만든다.
    */
    const status = document.getElementById("status");
    const say = (text) => { status.textContent = text; };

    document.addEventListener("click", (event) => {
      const node = event.target.closest("[data-menu]");
      if (node) { say(node.textContent.trim() + " 을 열었습니다."); return; }
      const row = event.target.closest("[data-row]");
      if (row) { say(row.querySelector("td").textContent.trim() + " 상세를 열었습니다."); return; }
      const tile = event.target.closest("[data-tile]");
      if (tile) { say("요약을 열었습니다."); return; }
      const more = event.target.closest("[data-more]");
      if (more) { say("더보기를 열었습니다."); }
    });
  </script>
</body>
</html>
